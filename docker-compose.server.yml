# 服务器部署版（宝塔 / 任意 Linux 主机）。
#
# 与仓库根目录 docker-compose.yml 的区别：
#   - 直接用 docker load 进来的镜像，不从源码构建
#   - 端口只绑回环，公网由宿主 Nginx 终结 TLS（见 docker/README.md 的宝塔章节）
#   - 公开地址与 Web 管理 token 通过 .env 注入
#
# 用法：
#   1) docker load -i ccr-<版本>-image.tar.gz   （包内唯一的镜像归档）
#   2) 在同一个目录建 .env（chmod 600），内容：
#        CCR_PUBLIC_BASE_URL=https://ccr.example.com
#        CCR_WEB_AUTH_TOKEN=<64 字符随机串，见下方生成命令>
#      生成 token：openssl rand -hex 32
#   3) docker compose -f docker-compose.server.yml up -d
#
# 若走完整发布包，以上三步已由包内 install.sh 自动完成。
# 归档文件名刻意不写死版本号：写死会随发版漂移，而 install.sh 是按
# ccr-*-image.tar.gz 模式查找的。

# 固定 compose 项目名。否则项目名取自所在目录名，而发布包解压出来的目录是
# ccr-<版本>-release —— 换个版本解压到新目录，具名卷就会变成
# ccr-<新版本>-release_ccr-data，与旧卷对不上，容器以空 /data 启动、看起来
# 像是"配置全丢了"。固定成 ccr 后，跨版本升级永远复用同一个卷。
name: ccr

services:
  ccr:
    # 仅用镜像, 不带 build: —— 服务器上没有源码, 避免 compose 误触发构建。
    image: helix-compressor:local
    container_name: ccr
    restart: unless-stopped
    ports:
      # 只绑回环：公网拿不到 3458，必须经宿主 Nginx 反代。
      - "127.0.0.1:3458:8080"
    volumes:
      # 配置/日志/压缩缓存持久化在具名卷里。
      - ccr-data:/data
    environment:
      CCR_WEB_AUTH_TOKEN: ${CCR_WEB_AUTH_TOKEN:?请在 .env 里设置 CCR_WEB_AUTH_TOKEN}
      CCR_PUBLIC_BASE_URL: ${CCR_PUBLIC_BASE_URL:-http://127.0.0.1:3458}
      # 加固模式：管理 token 不进 URL，改由反代请求头注入。
      # 开启后必须在反代之前至少加一层访问限制（Basic / oauth2-proxy / VPN），
      # 否则任何能访问该站点的人都等于管理员。
      CCR_WEB_INJECT_HEADER: ${CCR_WEB_INJECT_HEADER:-0}
    # 镜像已内置 ENTRYPOINT=ccr-docker-entrypoint，无需在此指定。

volumes:
  ccr-data:
    # 同上：固定卷名，避免随解压目录改名而"丢配置"。
    name: ccr-data
